# Medium-scale local-Qwen dataset generation config for analysis runs.
# Larger than the 12-example smoke test, but still practical on a single A100.

teacher_model: unsloth/Qwen3-8B
teacher_backend: vllm
prompt_dataset: openai/gsm8k
n_samples: 256
mix_teacher_ratio: 1.0

generation:
  max_new_tokens: 256
  temperature: 1.0
  batch_size: 8

filter:
  llm: null
  backend: local
  threshold: 78
  lls:
    quantile: null
    truncation_tokens: 20

lls:
  preference_dataset: allenai/tulu-2.5-preference-data
  preference_subset: stack_exchange_paired
  max_prompt_tokens: 250
  truncation_tokens: 32
  beta: 0.05
