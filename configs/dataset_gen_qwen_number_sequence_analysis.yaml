# Medium-scale local-Qwen config for paired A/B number-sequence experiments.
# Practical on a single A100 while still large enough to compare pi_A/pi_B/pi_AB/pi_reg.

teacher_model: unsloth/Qwen3-8B
teacher_backend: vllm
prompt_dataset: openai/gsm8k
n_samples: 1536
mix_teacher_ratio: 1.0

generation:
  max_new_tokens: 200
  temperature: 1.0
  batch_size: 8

filter:
  llm: null
  backend: local
  threshold: 78
  lls:
    quantile: null
    truncation_tokens: 20

lls:
  preference_dataset: allenai/tulu-2.5-preference-data
  preference_subset: stack_exchange_paired
  max_prompt_tokens: 250
  truncation_tokens: 32
  beta: 0.05
